[package]
name = "radicle-log"
version = "0.2.0"
description = "Radicle loggers"

edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test = []

[dependencies]
chrono = { workspace = true, features = ["clock"] }
